[pytest]
testpaths = testcases
python_files = test_*.py *_test.py Test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -s
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --capture=no
    --strict-markers
    --disable-warnings
    --headed
    --tracing=on

markers =
    regression: Regression test suite
    smoke: Smoke test suite