[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "W"]  # Enables pycodestyle, Pyflakes, and isort
ignore = []

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116"]  # Disables missing docstring warnings